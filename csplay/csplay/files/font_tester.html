<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teste de Fonte e Player</title>
  <style>
    body { font-family: var(--fonte, Arial), sans-serif; margin: 20px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; padding: 12px; border-radius: 8px; flex: 1 1 320px; }
    label { display:block; margin-top: 8px; }
    video { width: 100%; max-width: 640px; background: #000; }
    .mono { font-family: var(--fonte, 'Courier New'), monospace; }
  </style>
  <!-- hls.js and dash.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
</head>
<body>
  <h1>Teste de Fonte e Player</h1>
  <div class="row">
    <div class="card">
      <h2>Player Híbrido (HLS/DASH)</h2>
      <label>URL HLS (.m3u8): <input id="hlsUrl" type="text" placeholder="https://exemplo/stream.m3u8" style="width:100%"></label>
      <label>URL DASH (.mpd): <input id="dashUrl" type="text" placeholder="https://exemplo/manifest.mpd" style="width:100%"></label>
      <label>Estratégia:
        <select id="strategy">
          <option value="auto">Auto (tenta HLS depois DASH)</option>
          <option value="hls">Forçar HLS</option>
          <option value="dash">Forçar DASH</option>
        </select>
      </label>
      <label>Buffer inicial (segundos): <input id="buffer" type="number" min="0" step="1" value="3"></label>
      <button id="playBtn">Reproduzir</button>
      <video id="video" controls playsinline></video>
    </div>
    <div class="card">
      <h2>Teste de Fonte</h2>
      <label>Nome da fonte (CSS): <input id="fonte" type="text" placeholder="Arial"></label>
      <label>Tamanho (px): <input id="tamanho" type="number" min="8" step="1" value="16"></label>
      <button id="aplicar">Aplicar</button>
      <p id="texto" class="mono">A rápida raposa marrom salta sobre o cão preguiçoso 0123456789 !@#$%</p>
    </div>
  </div>

<script>
  function applyFont() {
    const fonte = document.getElementById('fonte').value || 'Arial';
    const tamanho = parseInt(document.getElementById('tamanho').value || '16', 10);
    document.body.style.setProperty('--fonte', fonte);
    const texto = document.getElementById('texto');
    texto.style.fontSize = tamanho + 'px';
  }
  document.getElementById('aplicar').addEventListener('click', applyFont);

  async function playHybrid() {
    const video = document.getElementById('video');
    const hlsUrl = document.getElementById('hlsUrl').value.trim();
    const dashUrl = document.getElementById('dashUrl').value.trim();
    const strategy = document.getElementById('strategy').value;
    const buffer = parseInt(document.getElementById('buffer').value || '3', 10);

    video.src = '';
    if (video.hls) { video.hls.destroy(); video.hls = null; }
    if (video.dash) { video.dash.reset(); video.dash = null; }

    function tryHLS() {
      if (Hls.isSupported() && hlsUrl) {
        const hls = new Hls({
          maxBufferLength: Math.max(5, buffer * 3),
          startPosition: buffer,
          enableWorker: true,
          lowLatencyMode: true,
        });
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
        video.hls = hls;
        video.play().catch(console.error);
        return true;
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = hlsUrl;
        video.play().catch(console.error);
        return true;
      }
      return false;
    }

    function tryDASH() {
      if (dashUrl) {
        const player = dashjs.MediaPlayer().create();
        player.initialize(video, dashUrl, true);
        player.updateSettings({
          streaming: {
            stableBufferTime: Math.max(5, buffer * 3),
            bufferPruningInterval: 10,
          }
        });
        video.dash = player;
        return true;
      }
      return false;
    }

    if (strategy === 'hls') {
      if (!tryHLS()) alert('HLS não suportado/não carregou.');
    } else if (strategy === 'dash') {
      if (!tryDASH()) alert('DASH não suportado/não carregou.');
    } else {
      // auto: tenta HLS, se falhar tenta DASH
      if (!tryHLS()) {
        if (!tryDASH()) alert('Nenhuma estratégia reproduziu.');
      }
    }
  }
  document.getElementById('playBtn').addEventListener('click', playHybrid);
</script>
</body>
</html>
